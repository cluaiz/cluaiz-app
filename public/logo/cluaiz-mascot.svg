<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="29 40 198 198">
  <defs>
    <filter id="tab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <style>
    .mascot-body {
      fill: #ffffff;
      stroke: #0a0a0a;
      stroke-width: 6;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .mascot-visor {
      fill: #000000;
    }
    .mascot-face {
      fill: #ffffff;
    }
    @media (prefers-color-scheme: light) {
      .mascot-body {
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 7;
      }
    }
  </style>

  <g filter="url(#tab-shadow)">
    <!-- Mascot Outer Body with High Contrast Border -->
    <path class="mascot-body" d="M 128 65
      C 99 65, 78 79, 69 104
      C 63 118, 61 130, 57 143
      C 54 153, 49 159, 41 167
      C 33 175, 36 182, 46 186
      C 55 190, 65 187, 73 183
      C 74 196, 81 210, 95 211
      C 108 212, 112 201, 117 195
      C 123 188, 133 188, 139 195
      C 144 201, 150 212, 163 211
      C 177 210, 183 196, 183 183
      C 191 187, 201 190, 210 186
      C 220 182, 223 175, 215 167
      C 207 159, 202 153, 199 143
      C 195 130, 193 118, 187 104
      C 178 79, 157 65, 128 65 Z" />

    <!-- Visor -->
    <path class="mascot-visor" d="M 95 94
      C 108 89, 118 89, 126 92
      C 131 94, 137 89, 146 90
      C 166 90, 179 103, 182 121
      C 186 140, 176 155, 161 160
      C 146 166, 111 167, 95 161
      C 78 155, 71 143, 74 125
      C 76 111, 82 100, 95 94 Z" />

    <!-- Eyes -->
    <ellipse class="mascot-face" cx="106" cy="125" rx="7.5" ry="12.2" />
    <ellipse class="mascot-face" cx="150" cy="125" rx="7.5" ry="12.2" />

    <!-- Smile -->
    <path class="mascot-face" d="M 119 134
      C 121 132, 124 136, 128 136
      C 132 136, 135 132, 138 134
      C 142 137, 139 143, 134 146
      C 130 148, 126 148, 122 146
      C 116 143, 114 137, 119 134 Z" />
  </g>
</svg>

